<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's happening F: Flyer flip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700&family=Spectral:ital,wght@1,500&display=swap">
<link rel="stylesheet" href="proto.css">
<link rel="stylesheet" href="flyers.css">
<link rel="stylesheet" href="week.css">
<link rel="stylesheet" href="events.css">
<link rel="stylesheet" href="setlist.css">
<style>
.sec{overflow-x:hidden;overflow-x:clip;}
/* F: the flyer itself, taped up with the group posters' slip under it. Turn it over and the set
   list is printed on the back. On first view it peeks, once, to show that it turns. */
.ff-wrap{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:start;}
.ff{--tilt:-1deg;position:relative;perspective:1800px;padding-top:16px;margin-right:10px;transition:height .6s var(--feed);}
.ff-card{position:relative;transform-style:preserve-3d;transform:rotate(var(--tilt));transform-origin:50% 0;height:100%;}
.ff-turn{position:relative;transform-style:preserve-3d;transition:transform .9s var(--press);height:100%;}
.ff.flip .ff-turn{transform:rotateY(180deg);}
.ff-face{position:absolute;left:0;right:0;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
.ff-back{transform:rotateY(180deg);}
.ff-ink{position:absolute;inset:0;transform:translate(9px,9px);background:var(--c);}
.ff-sheet{position:relative;background:var(--white);border:var(--key);}
.ff-sheet>img{display:block;width:100%;height:auto;}
.ff .tape{z-index:2;}
/* the slip under the flyer, like the group posters': the when on the left, the turn on the right */
.ff-slip{display:grid;grid-template-columns:minmax(0,1fr) auto;border-top:var(--key);}
.ff-slip p{margin:0;padding:12px 14px;font-size:13px;font-weight:700;letter-spacing:.08em;line-height:1.4;}
.ff-go{display:flex;align-items:center;gap:8px;padding:0 16px;border:0;border-left:var(--hair);background:none;color:var(--violet);font:inherit;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.ff-go i{font-style:normal;font-size:18px;line-height:1;display:inline-block;}
@media (hover:hover){.ff-go:hover{background:var(--violet);color:var(--white);}}
.ff-back .ff-sheet{padding:clamp(20px,3vw,32px) clamp(18px,2.6vw,28px) 0;}
.ff-back .sl-h{font-size:clamp(30px,3.6vw,42px);}
.ff-back .ff-slip{margin:20px calc(-1 * clamp(18px,2.6vw,28px)) 0;}
.ff-side .sl-lead{margin-top:16px;}
.ff .hlm{--hl-delay:.55s;}
.ff-side .ev-facts{margin:0 0 20px;}
/* the peek: a quarter-second lift of the right edge, once, after it's been on screen a moment */
.mo .ff.peek:not(.flip) .ff-turn{animation:ff-peek 1.1s var(--feed) .6s;}
@keyframes ff-peek{0%,100%{transform:none;}40%{transform:rotateY(-16deg);}}
@media (max-width:900px){
  .ff-wrap{grid-template-columns:1fr;}
  .ff{max-width:440px;width:calc(100% - 10px);margin:0 auto;--tilt:-.6deg;}
  .ff-side{max-width:440px;margin:0 auto;width:100%;}
  .ff-side .ev-btn{width:100%;}
}
@media (prefers-reduced-motion:reduce){.ff-turn,.ff{transition:none;}}
</style>
</head>
<body>
<div id="shell"></div>
<main class="sec"><div class="wrap" id="page"></div></main>
<div class="foot-stub">FOOTER STAYS AS IT IS</div>
<script src="shell.js"></script>
<script src="events.js"></script>
<script>
shell("f-flip.html");
const e = EVENT, when = eventWhen();
document.getElementById("page").innerHTML = head + ev.section(`<div class="ff-wrap">
  <div class="ff" id="ff" style="--c:var(--sky)">
    <div class="ff-card"><div class="ff-turn">
      <div class="ff-face ff-front" id="ff-front">
        <span class="ff-ink" aria-hidden="true"></span>
        <span class="tape" aria-hidden="true"></span>
        <div class="ff-sheet">
          <img src="${e.poster}" alt="${e.alt}" width="1019" height="1320">
          <div class="ff-slip"><p>${eventDate().toUpperCase()}<br>${e.start.toUpperCase()} TO ${e.end.toUpperCase()} · FREE</p>
            <button class="ff-go" data-flip aria-controls="ff-back">Turn it over <i aria-hidden="true">&#8635;</i></button></div>
        </div>
      </div>
      <div class="ff-face ff-back" id="ff-back" aria-label="The back of the flyer: the set list">
        <span class="ff-ink" aria-hidden="true"></span>
        <span class="tape" aria-hidden="true"></span>
        <div class="ff-sheet hlm" id="ff-sheet">
          <div class="sl-top">
            <div><p class="lbl">SET LIST</p><h2 class="sl-h">Open Mic Night</h2></div>
            ${when ? `<span class="sl-stamp">${when.short}</span>` : ""}
          </div>
          ${ev.setlist()}
          <p class="sl-note">${ev.slNote}</p>
          <div class="ff-slip"><p>${e.street.toUpperCase()}</p>
            <button class="ff-go" data-flip aria-controls="ff-front">Turn back <i aria-hidden="true">&#8634;</i></button></div>
        </div>
      </div>
    </div></div>
  </div>
  <div class="ff-side">
    <p class="sl-lead">${e.lead}</p>
    ${ev.facts()}
    ${ev.rsvp()}
    ${ev.ask()}
  </div>
</div>`) + `<div id="week"></div>`;
</script>
<script src="week.js"></script>
<script>
// Turning the flyer: the card is as tall as whichever side faces out, and the hidden side leaves the tab order
const ff = document.getElementById("ff"), front = document.getElementById("ff-front"), back = document.getElementById("ff-back");
if (ff) {
  const fit = () => { ff.style.height = (ff.classList.contains("flip") ? back : front).offsetHeight + 16 + "px"; };
  const set = (flip, keyboard) => {
    ff.classList.toggle("flip", flip);
    front.inert = flip; back.inert = !flip;
    fit();
    if (flip) document.getElementById("ff-sheet").classList.add("in");   // highlighter swipes once it faces out
    // keyboard users land on the button on the new side; taps leave focus alone (no ring on phones)
    if (keyboard) (flip ? back : front).querySelector("[data-flip]").focus({ preventScroll: true });
  };
  front.inert = false; back.inert = true;
  ff.querySelectorAll("[data-flip]").forEach((b) => b.addEventListener("click", (e) => set(!ff.classList.contains("flip"), e.detail === 0)));
  addEventListener("resize", fit); front.querySelector("img").addEventListener("load", fit); fit();
  ev.watch(ff, "peek", .6);
}
</script>
</body>
</html>
